name: Release

# Publishing is driven by tags, never by a branch push:
#
#   npm version patch        # or minor / major — commits + tags
#   git push --follow-tags   # this workflow runs
#
# It refuses to publish unless the tag matches package.json, so a stray tag can
# never ship the wrong version.
#
# ── Authentication ──────────────────────────────────────────────────────────
# The primary path is npm TRUSTED PUBLISHING (OIDC): npm mints a short-lived
# credential for this exact workflow, so there is no long-lived token to leak or
# rotate. It requires two things, both configured outside this file:
#
#   1. On npmjs.com -> the package -> Settings -> Trusted publishing:
#        Publisher: GitHub Actions
#        Organization / user: keycapai
#        Repository: <this repo>
#        Workflow filename: release.yml
#   2. The 'id-token: write' permission below (already set).
#
# If trusted publishing is not configured yet, the job falls back to a classic
# NPM_TOKEN secret, so the pipeline works either way.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not publish to npm'
        type: boolean
        default: true

permissions:
  contents: write   # attach the tarball to the GitHub release
  id-token: write   # mint the OIDC credential for trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; the one bundled with Node 22 can
      # predate OIDC support.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION"
          echo "tag:          $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Pack
        id: pack
        run: |
          # --silent keeps npm's warnings off stdout: with them in the stream the
          # output is not valid JSON and parsing it dies. --silent prints exactly
          # the tarball filename and nothing else.
          TARBALL="$(npm pack --silent)"
          if [ ! -f "$TARBALL" ]; then
            echo "::error::npm pack did not produce a tarball (got '$TARBALL')"
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL"

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public
        env:
          # Left empty on purpose when trusted publishing is configured: npm then
          # uses the OIDC identity. Set the NPM_TOKEN secret only as a fallback.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach the tarball to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.tarball }}
          generate_release_notes: true
